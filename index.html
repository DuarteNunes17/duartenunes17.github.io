<style>

@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

body{transition:background-color .4s,color .4s}

.mock{transition:transform .5s var(--ease)}.pc:hover .mock,.feat:hover .mock{transform:scale(1.02)}

+'<p>Fundamento legal: as diligências pré-contratuais que me pedires, como uma proposta de estágio, e o meu interesse legítimo em responder a quem me contacta (artigo 6.º, n.º 1, alíneas b) e f), do Regulamento Geral sobre a Proteção de Dados).</p>'
+'<p><strong>Preferências no teu dispositivo.</strong> O site guarda no teu browser o idioma que escolheste. Este dado não sai do teu dispositivo. Consulta a <a href="#cookies">Política de Cookies</a>.</p>'
+'<p><strong>Alojamento.</strong> Este site está alojado no GitHub Pages, um serviço da GitHub, Inc. Como em qualquer site, a GitHub regista dados técnicos de cada acesso, como o endereço IP, para garantir a segurança e o funcionamento do serviço. Eu não tenho acesso a esses registos. A GitHub pode tratar estes dados fora do Espaço Económico Europeu, com as garantias previstas no RGPD, e o tratamento segue a declaração de privacidade da GitHub.</p>'
+'<h2>Com quem são partilhados</h2><p>Não vendo nem partilho os teus dados. O meu email é gerido pela Google (Gmail), que guarda as mensagens por minha conta e pode tratá-las fora do Espaço Económico Europeu com as garantias previstas no RGPD. Se usares o botão “Enviar pelo Gmail”, estás a usar um serviço da Google, sujeito à política de privacidade da Google.</p>'
+'<h2>Durante quanto tempo</h2><p>Guardo os emails enquanto forem precisos para a conversa e apago-os, no máximo, 12 meses depois do último contacto, a não ser que daí resulte um estágio ou uma colaboração, ou que a lei me obrigue a guardá-los mais tempo.</p>'
+'<h2>Os teus direitos</h2><p>Podes pedir acesso aos teus dados, a sua correção ou apagamento, a limitação do tratamento e a portabilidade, ou opor-te ao tratamento, escrevendo para '+MAIL+'. Respondo no prazo máximo de um mês. Também podes apresentar reclamação à Comissão Nacional de Proteção de Dados (CNPD), em '+CNPD+'.</p>'
+'<h2>Decisões automáticas</h2><p>Não tomo decisões automatizadas nem crio perfis com os teus dados.</p>'
+'<h2>Alterações</h2><p>Se esta política mudar, atualizo a data no topo desta página.</p>'),
en:lp("Privacy Policy","Last updated: 10 November 2026",
'<h2>Who is responsible</h2><p>This is the personal portfolio of Duarte Ferreira Nunes, a student. I am the controller of the personal data described on this page. Contact: '+MAIL+'.</p>'
+'<h2>In short</h2><ul><li>This site has no accounts, uses no cookies, no analytics and no advertising, and does not store what you type into the form.</li><li>I only receive your data if you send me an email.</li></ul>'
+'<h2>What data I process and why</h2><p><strong>Contact form.</strong> The form does not send anything to any server. When you press “Prepare message”, your browser opens Gmail or your email app with the name, email, subject and message you typed. I only receive that data if you choose to send the email. I use it only to reply to you and, where relevant, to arrange the internship or project we discuss.</p>'
+'<p>Legal basis: steps you ask me to take before entering into an agreement, such as an internship offer, and my legitimate interest in replying to people who contact me (Article 6(1)(b) and (f) of the General Data Protection Regulation).</p>'
+'<p><strong>Preferences on your device.</strong> The site stores in your browser the language you chose. This data never leaves your device. See the <a href="#cookies">Cookie Policy</a>.</p>'
+'<p><strong>Hosting.</strong> This site is hosted on GitHub Pages, a service of GitHub, Inc. As with any website, GitHub logs technical data for each visit, such as the IP address, to keep the service secure and working. I do not have access to those logs. GitHub may process this data outside the European Economic Area with the safeguards required by the GDPR, under the GitHub Privacy Statement.</p>'
+'<h2>Who it is shared with</h2><p>I do not sell or share your data. My email is provided by Google (Gmail), which stores messages on my behalf and may process them outside the European Economic Area with the safeguards required by the GDPR. If you use the “Send with Gmail” button, you are using a Google service, subject to Google’s privacy policy.</p>'
+'<h2>How long</h2><p>I keep emails for as long as the conversation needs them and delete them no later than 12 months after our last contact, unless it leads to an internship or collaboration, or the law requires me to keep them longer.</p>'
+'<h2>Your rights</h2><p>You can ask for access to your data, its correction or erasure, restriction of processing and portability, or object to processing, by writing to '+MAIL+'. I will reply within one month at most. You can also lodge a complaint with the Portuguese data protection authority (CNPD) at '+CNPD+'.</p>'
+'<h2>Automated decisions</h2><p>I do not make automated decisions or build profiles from your data.</p>'
+'<h2>Changes</h2><p>If this policy changes, I will update the date at the top of this page.</p>')},
termos:{pt:lp("Termos de Utilização","Última atualização: 10 de novembro de 2026",
