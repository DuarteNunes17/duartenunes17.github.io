/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:5rem;scrollbar-color:var(--line) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--ff);-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
body.locked{overflow:hidden}
::selection{background:var(--acc);color:var(--on)}
a{color:var(--accink);text-underline-offset:.25em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
h1,h2,h3{margin:0;line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
p{text-wrap:pretty}
.w{max-width:76rem;margin:0 auto;padding:0 clamp(1.25rem,4vw,2.5rem)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:1rem;top:-4rem;z-index:90;background:var(--ink);color:var(--bg);padding:.75rem 1.25rem;border-radius:.5rem;font-weight:600;text-decoration:none;transition:top .2s}
.skip:focus{top:1rem}
.ic{display:inline-block;width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.ic svg{display:block;width:100%;height:100%}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pisca{50%{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

/* =========================================================
   3. ENTRADA (terminal de arranque)
   ========================================================= */
#boot{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:oklch(12% .015 262);color:oklch(92% .01 250);font:500 .9375rem/1.7 var(--mono);transition:opacity .7s var(--ease),visibility 0s .7s}
#boot.out{opacity:0;visibility:hidden}
#boot::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,oklch(100% 0 0/.025) 2px 3px);mix-blend-mode:screen}
#boot .bx{width:min(40rem,calc(100% - 2.5rem))}
#boot .cmd{color:oklch(80% .12 262)}
#boot .cmd b{color:oklch(92% .01 250);font-weight:500}

#boot li{opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
#boot li.in{opacity:1;transform:none}
#boot .okk{color:oklch(80% .16 152)}
#boot .pr{display:flex;justify-content:space-between;color:oklch(72% .02 255);font-size:.8125rem;margin-top:1.5rem}
#boot .bar{display:grid;grid-template-columns:repeat(32,1fr);gap:3px;margin-top:.5rem}
#boot .bar i{height:8px;border-radius:1px;background:oklch(28% .02 262);transition:background-color .2s}
#boot .bar i.on{background:oklch(75% .15 262)}
#boot .go{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.75rem;opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
#boot .go.in{opacity:1;transform:none}
#boot .go button{display:inline-flex;align-items:center;gap:.6rem;border:1.5px solid oklch(40% .03 262);background:none;color:oklch(95% .01 250);border-radius:.5rem;padding:.75rem 1.15rem;min-height:2.75rem;font:600 .9375rem var(--ff);cursor:pointer;transition:border-color .25s,background-color .25s,transform .25s var(--ease)}
#boot .go button:hover{border-color:oklch(75% .15 262);transform:translateY(-2px)}
#boot .go button.pri{background:oklch(75% .15 262);border-color:oklch(75% .15 262);color:oklch(15% .02 262)}
#boot .hint{color:oklch(60% .02 255);font-size:.8125rem;margin-top:1rem}
#boot .car{display:inline-block;width:.6em;height:1.05em;vertical-align:-.15em;background:oklch(80% .12 262);animation:pisca 1s steps(1) infinite}

/* =========================================================
   4. BARRA DE TOPO E NAVEGACAO
   ========================================================= */
header.bar{position:sticky;top:0;z-index:40;background:color-mix(in oklch,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

.brand{justify-self:start;display:flex;align-items:center;gap:.6rem;background:none;border:0;padding:.4rem 0;cursor:pointer;font:600 .875rem var(--mono);color:var(--ink)}
.brand .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in oklch,var(--ok) 60%,transparent);animation:vivo 2.4s ease-out infinite}
@keyframes vivo{70%{box-shadow:0 0 0 .45rem transparent}100%{box-shadow:0 0 0 0 transparent}}
.brand .pth{color:var(--mute)}
nav.main{position:relative;display:flex;gap:.125rem;padding:.25rem;border:1px solid var(--line);border-radius:99px;background:var(--surf)}
nav.main button{position:relative;z-index:1;display:flex;align-items:center;gap:.45rem;border:0;background:none;padding:.45rem .95rem;border-radius:99px;cursor:pointer;color:var(--mute);font:500 .9375rem var(--ff);transition:color .3s}

.tools{justify-self:end;display:flex;align-items:center;gap:.375rem}
.tbtn{position:relative;display:grid;place-items:center;width:2.4rem;height:2.4rem;border:1px solid var(--line);border-radius:.6rem;background:var(--surf);cursor:pointer;color:var(--ink);transition:border-color .25s,transform .25s var(--ease),background-color .25s}
.tbtn:hover{border-color:var(--ink);transform:translateY(-1px)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clock{font:500 .8125rem var(--mono);color:var(--mute);padding:0 .5rem;font-variant-numeric:tabular-nums}
.pop{position:absolute;right:0;top:calc(100% + .5rem);width:15rem;background:var(--surf);border:1px solid var(--line);border-radius:.85rem;padding:1rem;box-shadow:0 24px 48px -24px var(--sh);display:grid;gap:.9rem;z-index:50;animation:up .3s var(--ease)}
.pop[hidden]{display:none}
.pop h2{font:600 .875rem var(--mono);letter-spacing:0;color:var(--mute)}
.lb{display:block;font-size:.8125rem;color:var(--mute);margin-bottom:.35rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--cool);border-radius:.5rem;padding:.1875rem;gap:.1875rem}
.seg button{border:0;background:none;border-radius:.375rem;padding:.45rem;font:500 .875rem var(--ff);color:var(--mute);cursor:pointer;min-height:2.25rem}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px var(--sh)}
@media(max-width:760px){
 header.bar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
 header.bar .w{grid-template-columns:1fr auto}
 .brand .pth{display:none}.clock{display:none}
 nav.main{position:fixed;left:.75rem;right:.75rem;bottom:calc(.75rem + env(safe-area-inset-bottom,0px));top:auto;justify-content:space-between;z-index:45;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 40px -18px var(--sh)}
 nav.main button{flex:1;flex-direction:column;gap:.15rem;padding:.4rem .2rem;font-size:.6875rem}
 nav.main .ic{display:block;width:1.25rem;height:1.25rem}
 nav.main .ind{top:.25rem;bottom:.25rem}
 body{padding-bottom:5.5rem}
}

/* =========================================================
   5. PAGINA E TRANSICOES
   ========================================================= */
main{display:block;min-height:calc(100svh - 3.75rem)}
main:focus{outline:none}
main.out{opacity:0;transform:scale(.97);filter:blur(3px);transition:opacity .4s ease,transform .6s var(--io),filter .4s}

.crumb{font:500 .875rem var(--mono);color:var(--mute);margin:0 0 .75rem}
.crumb b{color:var(--accink);font-weight:500}

.rv.in{opacity:1;transform:none}
#pt{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;overflow:hidden}
#pt.busy{pointer-events:auto}
#pt .px{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--c,1),var(--s,56px));grid-auto-rows:var(--s,56px)}

   6. HOME — palco 3D
   ========================================================= */

.hud{position:absolute;inset:0;z-index:2;pointer-events:none}

.hrole b{color:var(--ink);font-weight:650}
.acts{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.75rem}

.btn .ic{transition:transform .3s var(--ease)}.btn:hover .ic-arr{transform:translateX(3px)}
.status{position:absolute;left:clamp(1.25rem,4vw,2.5rem);bottom:1.5rem;display:flex;flex-wrap:wrap;gap:.5rem;pointer-events:auto}
.chipst{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .75rem;border:1px solid var(--line);border-radius:99px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 .8125rem var(--mono);color:var(--mute)}
