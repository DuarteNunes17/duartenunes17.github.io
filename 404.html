<style>
:root{color-scheme:dark;--bg:#0b0f17;--ink:oklch(95% .01 250);--mute:oklch(72% .02 255);--acc:oklch(75% .15 262);--ok:oklch(80% .16 152);--bad:oklch(76% .15 28);--mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.6 var(--mono)}
main{width:min(560px,100%)}

<body>
<main>
<p><span class="u">duarte@portefolio</span>:~$ cd <span id="c"></span></p>
<p class="e">404: esta página não existe.</p>
<p class="m">A voltar ao início em <span id="n">5</span> s…</p>
<a href="/">Voltar ao início</a>
</main>
<script>
document.getElementById('c').textContent=location.pathname;
var n=5,el=document.getElementById('n'),t=setInterval(function(){n--;el.textContent=n;if(n<=0){clearInterval(t);location.replace('/');}},1000);
</script>
